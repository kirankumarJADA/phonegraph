version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: phonegraph-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (open in your browser)
      - "7687:7687"   # Bolt protocol (used by code)
    environment:
      - NEO4J_AUTH=neo4j/phonegraph2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./cypher:/cypher
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
