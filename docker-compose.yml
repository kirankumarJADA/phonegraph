# PhoneGraph — combined data layer (Neo4j + pgvector)
# Run from project root: docker-compose up -d
# Replaces the two separate compose files previously in
# phonegraph-neo4j/ and phonegraph-pgvector/.

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: phonegraph-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol (used by kg-retrieval service)
    environment:
      - NEO4J_AUTH=neo4j/phonegraph2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./phonegraph-neo4j/cypher:/cypher
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: phonegraph-pgvector
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=phonegraph
      - POSTGRES_USER=phonegraph
      - POSTGRES_PASSWORD=phonegraph2024
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  pgvector_data:
