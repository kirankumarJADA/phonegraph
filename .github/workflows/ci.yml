name: PhoneGraph CI

# Builds every microservice independently (no shared parent pom exists
# yet — each service has its own pom.xml). Runs on every push/PR to main.
#
# Note: phonegraph-kg-retrieval skips its test step in CI specifically
# because its default Spring context-load test opens a real connection
# pool to Neo4j + PostgreSQL at startup (via HikariCP), which only exist
# in the local Docker Compose environment, not on GitHub's runner. The
# service still gets built/compiled and verified here — only that one
# infra-dependent smoke test is skipped.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: phonegraph-kg-retrieval
            skip_tests: true
          - service: phonegraph-llm-orchestrator
            skip_tests: false
          - service: phonegraph-evaluation
            skip_tests: false
          - service: phonegraph-gateway
            skip_tests: false
          - service: phonegraph-catalogue
            skip_tests: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build ${{ matrix.service }} (tests skipped — needs live Neo4j/Postgres)
        if: matrix.skip_tests == true
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Build and test ${{ matrix.service }}
        if: matrix.skip_tests == false
        working-directory: ${{ matrix.service }}
        run: mvn -B clean verify

      - name: Verify build artifact exists
        working-directory: ${{ matrix.service }}
        run: |
          if [ -z "$(find target -maxdepth 1 -name '*.jar')" ]; then
            echo "No jar produced in target/ — build did not succeed as expected."
            exit 1
          fi
          echo "Build artifact found for ${{ matrix.service }}."
